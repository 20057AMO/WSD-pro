name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Start WSD-Pro Backend
        working-directory: ./backend
        env:
          WSD_JWT_SECRET: test-secret-key-123
          WSD_ADMIN_USER: admin
          WSD_ADMIN_PASSWORD: admin123
        run: |
          npm start &
          # Wait for backend to be ready by pinging health endpoint repeatedly
          for i in {1..15}; do
            curl -s http://127.0.0.1:3000/api/health && break
            sleep 2
          done

      - name: Run Smoke Tests
        working-directory: ./backend
        run: npm test
