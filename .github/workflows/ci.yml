name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + build backend
        working-directory: ./backend
        run: npm ci --no-fund --no-audit || npm install --no-fund --no-audit

      - name: Typecheck + build backend
        working-directory: ./backend
        run: npm run build

      - name: Install + build frontend
        working-directory: ./frontend
        run: npm ci --no-fund --no-audit || npm install --no-fund --no-audit

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Start WSD-Pro Backend
        working-directory: ./backend
        env:
          PORT: 3000
          OLLAMA_API_KEY: test-key
          WSD_WORKSPACE_IMAGE: ubuntu:24.04
          WSD_PROJECTS_DIR: /tmp/wsd-projects
        run: |
          npm start &
          # Wait for backend to be ready by pinging health endpoint repeatedly
          for i in {1..15}; do
            curl -s http://127.0.0.1:3000/api/health && break
            sleep 2
          done

      - name: Run Smoke Tests
        working-directory: ./backend
        run: npm test
