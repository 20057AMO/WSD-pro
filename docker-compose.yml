services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsd-pro
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      WSD_PROJECTS_DIR: /workspaces
      # Host-side absolute path of ./workspaces, used as the bind source when
      # launching project containers so their /workspace sees the same files
      # (bind sources resolve on the Docker Desktop VM, not inside this container).
      WSD_WORKSPACES_HOST_DIR: ${WSD_WORKSPACES_HOST_DIR:-./workspaces}
      WSD_WORKSPACE_IMAGE: wsd/workspace:latest
      WSD_IDE_PORT: 8100
      WSD_CHAT_MODEL: ${WSD_CHAT_MODEL:-qwen3:30b}
      WSD_DATA_DIR: /app/data
      # JWT signing secret — set JWT_SECRET in .env (see .env.example) or tokens
      # are signed with this publicly known fallback (dev only!).
      JWT_SECRET: ${JWT_SECRET:-wsd-pro-insecure-default}
      OLLAMA_HOST: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      WSD_OPENCODE_PORT: ${WSD_OPENCODE_PORT:-4096}
      # Production defaults to WSD_TESTING=0 (real rate ceilings). Only the
      # automated-suite container should set WSD_TESTING=1 to relax the
      # global/strict/agent-write ceilings (index.ts) so multi-suite teardown
      # never trips them mid-run. The auth/unlock/totp brute-force scopes stay
      # at their REAL values in both — exactly what the security suites assert.
      WSD_TESTING: ${WSD_TESTING:-0}
      # Crash-detector sweep cadence (min 5s; lower = faster detection, more
      # docker inspect calls per second).
      WSD_ALERT_SWEEP_MS: ${WSD_ALERT_SWEEP_MS:-10000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/workspaces
      - wsd-data:/app/data
      - code-server-config:/root/.config/code-server
      - code-server-data:/root/.local/share/code-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Only the dashboard is published. code-server (8080) and opencode web
      # (4096) run INSIDE this container and are reached EXCLUSIVELY through
      # the authenticated Express reverse proxy at /ide and /oc — their ports
      # are deliberately NOT published to the host, closing the unauthenticated
      # bypass (any LAN user could previously open every workspace directly).
      - "3000:3000"
    depends_on:
      - workspace

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: wsd/workspace:latest
    container_name: wsd-workspace
    restart: unless-stopped
    command: [ "sleep", "infinity" ]

volumes:
  wsd-data:
  code-server-config:
  code-server-data:
