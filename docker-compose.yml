services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsd-pro
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      WSD_PROJECTS_DIR: /workspaces
      WSD_WORKSPACE_IMAGE: wsd/workspace:latest
      WSD_IDE_PORT: 8100
      WSD_CHAT_MODEL: ${WSD_CHAT_MODEL:-qwen3:30b}
      OLLAMA_HOST: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?set OLLAMA_API_KEY in .env}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      WSD_IDE_PASSWORD: ${WSD_IDE_PASSWORD:-admin123}
      WSD_OPENCODE_PORT: ${WSD_OPENCODE_PORT:-4096}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/workspaces
      - wsd-data:/app/data
    ports:
      - "3000:3000"
      - "8100:8080"
      - "${WSD_OPENCODE_PORT:-4096}:4096"
    depends_on:
      - workspace

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: wsd/workspace:latest
    container_name: wsd-workspace
    restart: unless-stopped
    command: [ "sleep", "infinity" ]

volumes:
  wsd-data:
